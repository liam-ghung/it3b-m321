server:
  port: 8080

spring:
  application:
    name: chat-service

  # Verbindung zur Datenbank aus docker-compose.
  # Zugangsdaten stehen hier im Klartext, weil das eine Uebungsumgebung ist.
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat-local-only}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:chat}
    password: ${RABBITMQ_PASSWORD:chat-local-only}

# Swagger UI liegt unter http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpunkte nach Reihenfolge im Controller sortieren statt alphabetisch
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
